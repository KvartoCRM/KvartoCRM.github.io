name: Release KvartoCRM applications

on:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  quality:
    name: Tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run lint
      - run: npm run build:sites

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build:android
      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/lumicrm-release.p12
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/lumicrm-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LUMICRM_VERSION_CODE: ${{ github.run_number }}
        run: |
          export LUMICRM_VERSION_NAME="${GITHUB_REF_NAME#app-v}"
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            ./gradlew assembleRelease && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle download/build failed, retrying ($attempt/3)..."
              sleep $((attempt * 15))
            fi
          done
          exit 1
      - run: cp android/app/build/outputs/apk/release/app-release.apk KvartoCRM-Android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: kvartocrm-android
          path: KvartoCRM-Android.apk

  windows:
    name: Windows installer
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: kvartocrm-windows
          path: |
            release/KvartoCRM-Windows-Setup.exe
            release/KvartoCRM-Windows-Setup.exe.blockmap
            release/latest.yml

  release:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "KvartoCRM ${GITHUB_REF_NAME#app-v}" --notes "Установочные файлы KvartoCRM для Android и Windows. Данные CRM доступны офлайн после первой синхронизации с аккаунтом. Следующие версии Windows устанавливаются автоматически, Android обновляется поверх текущей установки без удаления данных."
          fi
