<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kvarto-icon-192.png" />
    <link rel="apple-touch-icon" href="/kvarto-apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="application-name" content="KvartoCRM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KvartoCRM" />
    <meta name="description" content="KvartoCRM — ваш личный облачный офис для недвижимости" />
    <title>KvartoCRM</title>
    <script>
      const theme = localStorage.getItem('lumicrm-theme') || 'midnight';
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', !['lumi-light', 'warm-sand'].includes(theme));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:' && new URLSearchParams(window.location.search).get('desktop') !== '1') {
        document.getElementById('root').innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b14;color:#f8fafc;font-family:Inter,Segoe UI,sans-serif">
            <section style="width:min(520px,100%);padding:36px;border:1px solid #263248;border-radius:24px;background:#101827;box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center">
              <img src="./public/kvarto-icon-192.png" alt="KvartoCRM" style="width:88px;height:88px;border-radius:22px" />
              <h1 style="margin:22px 0 10px;font-size:28px">KvartoCRM запускается через ярлык</h1>
              <p style="margin:0;color:#aebbd0;line-height:1.65">Исходный файл сайта нельзя открывать двойным кликом. Используйте ярлык <strong style="color:#fff">KvartoCRM</strong> на рабочем столе или публичный адрес приложения.</p>
            </section>
          </main>`
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
