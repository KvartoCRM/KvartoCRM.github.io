<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 82%, rgba(22, 139, 255, .25), transparent 42%),
          radial-gradient(circle at 84% 16%, rgba(135, 56, 243, .3), transparent 43%),
          linear-gradient(145deg, #050914, #081124 52%, #10092b);
        color: white;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }
      .brand { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 3vmin, 28px); }
      img { width: clamp(98px, 26vmin, 220px); height: clamp(98px, 26vmin, 220px); filter: drop-shadow(0 24px 35px rgba(16, 42, 150, .35)); }
      .name { font-size: clamp(26px, 7vmin, 58px); font-weight: 650; letter-spacing: -.045em; }
      .name span { color: rgba(255, 255, 255, .64); font-weight: 300; }
      .tagline { margin-top: -8px; color: rgba(255,255,255,.48); font-size: clamp(9px, 1.9vmin, 15px); font-weight: 650; letter-spacing: .26em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../public/kvarto-icon.svg" alt="">
      <div class="name">Kvarto<span>CRM</span></div>
      <div class="tagline">Офис недвижимости</div>
    </div>
  </body>
</html>
